name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 单页应用每次发布内容都会变，让 sitemap 的 <lastmod> 跟着构建日期走，
      # 免得上线后忘记手改。public/ 下的文件由 Vite 原样拷进 dist/。
      - name: Stamp sitemap lastmod
        run: |
          sed -i "s|<lastmod>[0-9-]*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" public/sitemap.xml
          grep -o '<lastmod>[^<]*</lastmod>' public/sitemap.xml

      - name: Typecheck & Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
